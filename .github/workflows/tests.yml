name: Non-live regression tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run non-live tests (live tests are explicitly deselected)
        run: python -m pytest -m "not live" -q -ra --junitxml=test-results.xml
      - name: Audit every skip
        if: always()
        run: python scripts/check_test_skips.py test-results.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: error
