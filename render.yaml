# Render Blueprint for the fund performance review app (step 11): New > Blueprint in the Render dashboard, then
# pick this repo. The service keeps the old app's name, so an existing service is updated in place.
services:
  - type: web
    name: fund-report-agent
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py          # app.py adds src/ to the path and starts the Gradio page on $PORT
    healthCheckPath: /                   # 200 even with the login on (the login page); nothing else is served without it
    autoDeploy: true
    envVars:
      # Secrets: Render asks for these when you create the Blueprint; they never go in the repo
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_USERNAME                # the page asks for these before it opens; without them AI runs are off
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: AI_RUNS_ENABLED             # the independent AI switch: off unless "true" (set it in the dashboard after
        sync: false                      # the offline smoke test; a dashboard value is never overwritten by this file)
      - key: RESEND_API_KEY              # optional: email the report (off by default in config/settings.yaml)
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO                    # comma-separated recipients; kept out of the public repository
        sync: false
      # Plain settings
      - key: PYTHON_VERSION              # the version tested (Python 3.13)
        value: "3.13.16"
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      - key: GRADIO_ANALYTICS_ENABLED
        value: "False"
