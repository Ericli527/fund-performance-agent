  - "No verified peer fund is available, so value for investors and fees are not compared."
  - "Pricing time not stated: the factsheet gives a 12:00 London dealing cut-off and says performance is calculated on the closing NAV, but not the valuation time, so the profile records it as not stated and the reports say a timing difference cannot be ruled out."
  - "The price download runs to 29 Oct 2026; prices after 30 Sep 2026 are left out of the September review."
