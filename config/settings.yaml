# Fund Performance Agent: run settings (step 10)
#
# timeouts_seconds: the longest each AI step may take. A step that runs over is stopped and handled like a
#   failed step (flagged in the report), so one slow call cannot hold up the review.
# web: limits that protect the API key, as well as the page's login (APP_USERNAME and APP_PASSWORD in .env or
#   Render's settings). Offline runs are not limited.
# statistics: the evidence dashboard's significance test (one-sample t-test, two-sided). It runs only with at least
#   min_points yearly values, and not when rounding makes most values identical.
# email: sending the report is plain code (not an AI agent) and is OFF by default. It goes through Resend over
#   HTTPS (as in the old app; Render's free plan blocks SMTP ports). The key is RESEND_API_KEY in .env, never in
#   this file. Recipients come only from EMAIL_TO in .env (or Render's environment), comma-separated, so they are
#   never in the public repository. Sender: `sender` below, else EMAIL_FROM, else Resend's test sender (delivers
#   only to your Resend account's address). Only the PDF of public data is sent.

timeouts_seconds:
  extractor: 180
  mandate: 90
  research: 240        # approved pages, planner and web searches together
  narrative: 300       # Analyst, code checks, Evaluator and the one rewrite together
  task_planner: 60     # the Task Planner Agent's plan
  drafting: 300        # Reporting Agents, code checks, the Judge and the send-back together

drafting:
  max_rewrites: 1      # if no draft passes the checklist, send them all back this many times, then use code's text
  max_summary_chars: 700   # a longer draft fails code's checks (Executive page 1 overflows at about 950)

web:
  max_ai_runs_per_day: 20          # reviews that use AI (reading documents, or a JSON run with AI), counted per day
  max_ai_runs_at_once: 1           # another AI review that starts meanwhile is asked to try again in 2 minutes

statistics:
  significance_level: 0.05         # 5%: "statistically significant" when p is below this
  min_points: 8                    # fewer yearly values than this: no test

email:
  enabled: false
  attachment: executive  # executive (report_executive.pdf, 2 pages) or detailed (report.pdf with the appendices)
  sender: ""           # e.g. "Fund Report <reports@yourdomain.com>" (a domain verified in Resend)
  subject: "Fund performance review (draft): {fund_name}, figures to {as_of_date}"
